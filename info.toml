format_version = 1

welcome_message = """
처음이신가요? 걱정 마세요, Rustlings는 초보자를 위해 만들어졌습니다!
Rust에 대해 많은 것을 알려드리겠지만, 시작하기 전에 Rustlings가 어떻게
작동하는지 몇 가지 알려드릴게요:

1. Rustlings의 핵심 개념은 연습문제를 풀어보는 거에요. 이 연습문제들에는
   보통 컴파일러 오류나 로직 오류가 포함되어 있어서 컴파일이나 테스트가
   실패해요. 모든 오류를 찾아서 고치는 게 여러분의 임무입니다!
2. `rustlings/` 디렉토리에서 에디터를 열어두세요. Rustlings는 진행바 아래에
   현재 연습문제의 경로를 보여줘요. 에디터에서 연습문제 파일을 열고, 오류를
   고치고, 파일을 저장하세요. Rustlings가 자동으로 파일 변경을 감지해서
   연습문제를 다시 실행해요. 모든 오류가 수정되면, Rustlings가 다음 연습문제로
   넘어갈지 물어볼 거에요.
3. 연습문제에서 막히면 `h`를 입력해서 힌트를 확인하세요.
4. 연습문제가 이해가 안 되면, GitHub에 이슈를 남겨주세요!
   (https://github.com/rust-lang/rustlings). 모든 이슈를 확인하고 있고,
   다른 학습자들도 볼 수 있어서 서로 도움을 줄 수 있어요!"""

final_message = """
Rust의 다양한 측면에 대해 즐겁게 배우셨기를 바랍니다!
문제를 발견하셨다면, GitHub에 보고하는 것을 망설이지 마세요.
더 넓은 커뮤니티를 돕기 위해 자신만의 연습문제를 기여할 수도 있어요!

이슈를 보고하거나 기여하기 전에, 가이드라인을 읽어주세요:
https://github.com/rust-lang/rustlings/blob/main/CONTRIBUTING.md"""

# INTRO

[[exercises]]
name = "intro1"
dir = "00_intro"
test = false
skip_check_unsolved = true
hint = """
`n`을 입력해서 다음 연습문제로 넘어가세요.
`n`을 입력한 후 ENTER를 눌러야 할 수도 있어요."""

[[exercises]]
name = "intro2"
dir = "00_intro"
test = false
hint = """
컴파일러가 출력 매크로의 이름이 잘못되었다고 알려주고 있어요.
대안도 제안해주고 있네요."""

# VARIABLES

[[exercises]]
name = "variables1"
dir = "01_variables"
test = false
hint = """
`main` 함수의 선언부에 Rust에서 새로운 변수 바인딩을 만들 때 필요한
키워드가 빠져 있어요."""

[[exercises]]
name = "variables2"
dir = "01_variables"
test = false
hint = """
컴파일러 메시지는 주어진 정보만으로는 변수 바인딩 `x`의 타입을
Rust가 추론할 수 없다고 말하고 있어요.

`main` 함수의 첫 번째 줄에 타입 어노테이션을 추가하면 어떻게 될까요?

`x`에 값을 주면 어떨까요?

둘 다 하면 어떨까요?

`x`는 어떤 타입이어야 할까요?

`x`가 `10`과 같은 타입이면 어떨까요? 다른 타입이면요?"""

[[exercises]]
name = "variables3"
dir = "01_variables"
test = false
hint = """
이 연습문제에서는 `main` 함수에서 변수 바인딩을 만들었고, 다음 줄에서
사용하려고 하지만, 값을 할당하지 않았어요.

존재하지 않는 것을 출력할 수는 없어요. `x`에 값을 할당해보세요!

이것은 어떤 프로그래밍 언어에서든 매우 쉽게 할 수 있는 버그를 유발하는
오류에요 -- 다행히 Rust 컴파일러가 이것을 잡아줬네요!"""

[[exercises]]
name = "variables4"
dir = "01_variables"
test = false
hint = """
Rust에서 변수 바인딩은 기본적으로 불변(immutable)이에요. 하지만 여기서는
`x`에 다른 값을 다시 할당하려고 하고 있죠! 변수 바인딩을 가변(mutable)으로
만들기 위해 사용할 수 있는 키워드가 있어요."""

[[exercises]]
name = "variables5"
dir = "01_variables"
test = false
hint = """
`variables4`에서 특별한 키워드를 사용해서 불변 변수를 가변으로 만드는 방법을
이미 배웠어요. 하지만 이 연습문제에서는 기존 변수에 다른 타입의 값을 할당하고
싶기 때문에 그 방법이 큰 도움이 되지 않아요. 때로는 이 연습문제처럼 값을 다른
타입으로 변환할 때 기존 변수 이름을 재사용하고 싶을 수도 있어요.

다행히 Rust에는 이 문제에 대한 강력한 해결책이 있어요: '섀도잉(Shadowing)'!
'섀도잉'에 대해 더 알고 싶다면 Rust 책의 '변수와 가변성' 섹션을 읽어보세요:
https://doc.rust-lang.org/book/ch03-01-variables-and-mutability.html#shadowing

이 기법을 사용해서 연습문제를 풀어보세요."""

[[exercises]]
name = "variables6"
dir = "01_variables"
test = false
hint = """
변수와 가변성에 대해 배웠지만, 사용할 수 있는 또 다른 중요한 변수 타입이
있어요: 상수(constants).

상수는 항상 불변이에요. `let` 대신 `const` 키워드로 선언해요.

상수의 타입은 항상 어노테이션해야 해요.

상수와 변수의 차이에 대해 더 알고 싶다면 Rust 책의 '변수와 가변성' 섹션의
'상수'를 읽어보세요:
https://doc.rust-lang.org/book/ch03-01-variables-and-mutability.html#constants"""

# FUNCTIONS

[[exercises]]
name = "functions1"
dir = "02_functions"
test = false
hint = """
이 `main` 함수는 존재할 것으로 기대하는 함수를 호출하고 있지만, 그 함수가
존재하지 않아요. `call_me`라는 이름의 함수를 기대하고 있어요.
또한 이 함수는 인자를 받지 않고 값을 반환하지 않아야 해요.
`main`과 매우 비슷하지 않나요?"""

[[exercises]]
name = "functions2"
dir = "02_functions"
test = false
hint = """
Rust는 함수 시그니처의 모든 부분에 타입 어노테이션이 있어야 해요.
하지만 `call_me`에서 `num`의 타입 어노테이션이 빠져 있어요."""

[[exercises]]
name = "functions3"
dir = "02_functions"
test = false
hint = """
이번에는 함수 *선언*은 괜찮지만, 함수를 호출하는 부분에 문제가 있어요."""

[[exercises]]
name = "functions4"
dir = "02_functions"
test = false
hint = """
에러 메시지가 `sale_price` 함수를 가리키며 `->` 뒤에 타입이 필요하다고
말하고 있어요. 이곳이 함수의 반환 타입이 와야 하는 곳이에요.
`is_even` 함수를 예시로 참고해보세요!"""

[[exercises]]
name = "functions5"
dir = "02_functions"
test = false
hint = """
이것은 한 글자를 제거하면 고칠 수 있는 매우 흔한 오류에요.
Rust가 표현식(expression)과 구문(statement)을 구분하기 때문에 발생해요:
표현식은 피연산자에 기반한 값을 반환하고, 구문은 단순히 C/C++의 `void`처럼
동작하는 `()` 타입을 반환해요.

`square` 함수에서 `i32` 타입의 값을 반환하고 싶지만, `()` 타입을
반환하고 있어요.

두 가지 해결 방법이 있어요:
1. `num * num;` 앞에 `return` 키워드를 추가하기
2. `num * num` 뒤의 세미콜론 `;`을 제거하기"""

# IF

[[exercises]]
name = "if1"
dir = "03_if"
hint = """
원한다면 한 줄로 작성할 수도 있어요!

다른 언어에서의 비슷한 예시:
- C(++)에서는: `a > b ? a : b`
- Python에서는: `a if a > b else b`

Rust에서 기억할 점:
- `if` 조건에 괄호를 감싸지 않아도 돼요
- `if`/`else` 조건문은 표현식(expression)이에요
- 각 조건 뒤에는 `{}` 블록이 와요"""

[[exercises]]
name = "if2"
dir = "03_if"
hint = """
첫 번째 컴파일러 오류에 대해, Rust에서는 각 조건 블록이 같은 타입을
반환하는 것이 중요해요!

테스트를 통과하려면, 다른 입력 값을 확인하는 몇 가지 조건이 필요해요.
테스트를 읽어서 무엇을 기대하는지 확인해보세요."""

[[exercises]]
name = "if3"
dir = "03_if"
hint = """
Rust에서는 `if` 표현식의 모든 분기(arm)가 같은 타입의 값을 반환해야 해요.
모든 분기에서 타입이 일관되게 해주세요."""

