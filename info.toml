name = "tests3"
dir = "17_tests"
hint = """
`Rectangle::new` 메서드가 음수 값에 대해 패닉을 일으킬 것으로 예상해요.

이것을 처리하려면, 테스트 함수에 특별한 속성(attribute)을 추가해야 해요.

문서를 참고하세요:
https://doc.rust-lang.org/book/ch11-01-writing-tests.html#checking-for-panics-with-should_panic"""

# STANDARD LIBRARY TYPES

[[exercises]]
name = "iterators1"
dir = "18_iterators"
hint = """
반복자(iterator)는 컬렉션의 모든 요소를 순회하지만, 요소가 다 떨어지면
어떻게 될까요? 여기서 무엇을 기대해야 할까요? 막히면 다음을 참고하세요:
https://doc.rust-lang.org/std/iter/trait.Iterator.html"""

[[exercises]]
name = "iterators2"
dir = "18_iterators"
hint = """
`capitalize_first`:

변수 `first`는 `char`에요. 올바른 `String`을 반환하려면 대문자로 변환해서
`chars`의 나머지 문자들에 추가해야 해요.

`chars`의 나머지 문자들은 `as_str` 메서드를 사용해서 문자열 슬라이스로
볼 수 있어요.

`char` 문서에 유용한 메서드가 많이 있어요.
https://doc.rust-lang.org/std/primitive.char.html

`char::to_uppercase`를 사용하세요. `String`으로 변환할 수 있는 반복자를
반환해요.

`capitalize_words_vector`:

슬라이스에서 반복자를 만드세요. `capitalize_first` 함수를 적용해서 반복된
값들을 변환하세요. 반복자를 `collect`하는 것을 잊지 마세요.

`capitalize_words_string`:

이것은 놀랍게도 이전 해결책과 매우 비슷해요. `collect`는 매우 강력하고
범용적이에요. Rust는 원하는 타입만 알면 돼요."""

[[exercises]]
name = "iterators3"
dir = "18_iterators"
hint = """
`divide` 함수는 제수가 0이거나 균등한 나눗셈이 불가능할 때 올바른 에러를
반환해야 해요.

`division_results` 변수는 컬렉션 타입으로 collect되어야 해요.

`result_with_list` 함수는 성공 케이스가 정수 벡터이고 실패 케이스가
`DivisionError`인 단일 `Result`를 반환해야 해요.

`list_of_results` 함수는 결과들의 벡터를 반환해야 해요.

`collect()`에서 `FromIterator` 트레이트가 어떻게 사용되는지 참고하세요:
https://doc.rust-lang.org/std/iter/trait.Iterator.html#method.collect
이 트레이트는 정말 강력해요! 이 연습문제의 해결책을 훨씬 쉽게 만들어줄 수
있어요."""

[[exercises]]
name = "iterators4"
dir = "18_iterators"
hint = """
명령형 언어에서는 가변 변수를 업데이트하는 `for` 루프를 작성할 수 있어요.
또는 재귀와 match 절을 활용하는 코드를 작성할 수도 있어요. Rust에서는
범위(range)와 반복자를 사용해서 팩토리얼을 우아하게 계산하는 또 다른
함수형 접근 방식을 사용할 수 있어요.

`fold`와 `rfold` 메서드를 확인해보세요!"""

[[exercises]]
name = "iterators5"
dir = "18_iterators"
hint = """
`std::iter::Iterator` 트레이트의 문서에 여기서 도움이 될 많은 메서드가
있어요.

`count_collection_iterator`의 `collection` 변수는 `HashMap`들의
슬라이스에요. 반복자 메서드를 사용하려면 반복자로 변환해야 해요.

`fold` 메서드가 `count_collection_iterator` 함수에서 유용할 수 있어요.

추가 도전으로, `Iterator` 문서를 참고해서 `fold`를 사용하는 것보다
코드를 더 간결하게 만들 수 있는 다른 메서드를 찾아보세요."""

# SMART POINTERS

[[exercises]]
name = "smart_pointers1"
dir = "19_smart_pointers"
hint = """
컴파일러의 메시지가 도움이 될 거에요: 재귀 타입을 다룰 때 실제 타입의 값을
저장할 수 없으므로, 값에 대한 참조(포인터)를 저장해야 해요.

따라서 `List`를 `Box` 안에 넣어야 해요. Rust 책에서 더 자세히 알아보세요:
https://doc.rust-lang.org/book/ch15-01-box.html#enabling-recursive-types-with-boxes

빈 리스트를 만드는 것은 꽤 간단해야 해요 (힌트: 테스트를 읽어보세요).

비어있지 않은 리스트의 경우, `Cons` 리스트 빌더를 사용하고 싶다는 것을
기억하세요. 현재 리스트는 정수(`i32`) 리스트이지만, 정의를 바꿔서 다른
타입도 시도해보세요!"""

[[exercises]]
name = "smart_pointers2"
dir = "19_smart_pointers"
hint = """
이것은 `Rc<T>` 타입을 사용하는 간단한 연습문제에요. 각 `Planet`은 `Sun`의
소유권을 가지고, `Rc::clone()`을 사용해서 `Sun`의 참조 카운트를 증가시켜요.

`drop()`을 사용해서 `Planet`들을 개별적으로 스코프 밖으로 이동시키면,
참조 카운트가 줄어들어요.

결국 `Sun`은 자기 자신에 대한 하나의 참조만 다시 가지게 돼요.

더 알아보세요: https://doc.rust-lang.org/book/ch15-04-rc.html

안타깝게도, 명왕성은 더 이상 행성으로 간주되지 않아요 :("""

[[exercises]]
name = "smart_pointers3"
dir = "19_smart_pointers"
test = false
hint = """
`numbers` 벡터로부터 `shared_numbers`를 `Arc`로 만드세요. 그런 다음,
`numbers`의 복사본을 만드는 것을 피하려면, 루프 안에서 하지만 여전히 메인
스레드에서 `child_numbers`를 만들어야 해요.

`child_numbers`는 숫자의 스레드-로컬 복사본이 아닌 숫자의 `Arc`의
클론이어야 해요.

기본 개념을 이해하면 간단한 연습문제이지만, 너무 어렵다면 Rust 책의
16장 전체를 읽어보는 것을 고려하세요:
https://doc.rust-lang.org/book/ch16-00-concurrency.html"""

[[exercises]]
name = "smart_pointers4"
dir = "19_smart_pointers"
hint = """
`Cow`가 이미 데이터를 소유하고 있다면, `to_mut()`이 호출될 때 클론할
필요가 없어요.

`Cow` 타입의 문서를 확인해보세요:
https://doc.rust-lang.org/std/borrow/enum.Cow.html"""

# THREADS

[[exercises]]
name = "threads1"
dir = "20_threads"
test = false
hint = """
`JoinHandle`은 생성된 스레드로부터 반환되는 구조체에요:
https://doc.rust-lang.org/std/thread/fn.spawn.html

멀티스레드 애플리케이션의 어려운 점은 메인 스레드가 생성된 스레드보다
먼저 끝날 수 있다는 거에요.
https://doc.rust-lang.org/book/ch16-01-threads.html#waiting-for-all-threads-to-finish-using-join-handles

`JoinHandle`을 사용해서 각 스레드가 끝날 때까지 기다리고 결과를 수집하세요.

https://doc.rust-lang.org/std/thread/struct.JoinHandle.html"""

[[exercises]]
name = "threads2"
dir = "20_threads"
test = false
hint = """
`Arc`는 **불변** 데이터에 대한 안전하고 공유된 접근을 허용하는 원자적 참조
카운트 포인터에요. 하지만 `jobs_done`의 수를 *변경*하고 싶으므로, 한 번에
하나의 스레드만 데이터를 변경할 수 있게 하는 또 다른 타입도 사용해야 해요.
Rust 책의 이 섹션을 참고하세요:
https://doc.rust-lang.org/book/ch16-03-shared-state.html#atomic-reference-counting-with-arct

더 많은 힌트를 원하면 계속 읽어보세요 :)

이제 `main`의 시작 부분에 `Arc<Mutex<JobStatus>>`가 있나요? 이렇게요:
```
let status = Arc::new(Mutex::new(JobStatus { jobs_done: 0 }));
```

Rust 책의 다음 예시와 비슷해요:
https://doc.rust-lang.org/book/ch16-03-shared-state.html#sharing-a-mutext-between-multiple-threads"""

[[exercises]]
name = "threads3"
dir = "20_threads"
hint = """
스레드 간 동시성을 처리하는 또 다른 방법은 `mpsc`(다중 생산자, 단일 소비자)
채널을 사용해서 통신하는 거에요.

송신 단과 수신 단이 모두 있으면, 한 스레드에서 값을 보내고 다른 스레드에서
받을 수 있어요.

원래 송신 단의 `clone()`을 사용해서 복제하면 다중 생산자가 가능해요.

Rust 책의 관련 섹션:
https://doc.rust-lang.org/book/ch16-02-message-passing.html"""

# MACROS

[[exercises]]
name = "macros1"
dir = "21_macros"
test = false
hint = """
매크로를 호출할 때는 일반 함수 호출과 비교해서 특별한 것을 추가해야 해요."""

[[exercises]]
name = "macros2"
dir = "21_macros"
test = false
hint = """
매크로는 어디서 무엇을 사용할 수 있는지에 대해 Rust의 나머지 부분과 같은
규칙을 따르지 않아요.

Rust의 다른 것들과 달리, "매크로를 정의하는 위치"와 "사용하는 위치"의
순서가 실제로 중요해요."""

[[exercises]]
name = "macros3"
dir = "21_macros"
test = false
hint = """
모듈 외부에서 매크로를 사용하려면, 매크로를 부모로 끌어올리기 위해
모듈에 특별한 작업을 해야 해요."""

[[exercises]]
name = "macros4"
dir = "21_macros"
test = false
hint = """
이것을 컴파일하려면 한 글자만 추가하면 돼요.

매크로가 작성되는 방식에서, 각 "매크로 팔(arm)" 사이에 무언가를 구분자로
넣어야 해요.

여기서 매크로 연습문제는 이것이 전부이지만, Rust 매크로로 할 수 있는 것의
표면만 겨우 긁은 거에요. 더 자세한 소개를 원한다면 'The Little Book of
Rust Macros'를 읽어보세요:
https://veykril.github.io/tlborm/"""

#  CLIPPY

[[exercises]]
name = "clippy1"
dir = "22_clippy"
test = false
strict_clippy = true
hint = """
Rust는 일부 긴 또는 무한 정밀도 수학 상수의 최고 정밀도 버전을 Rust 표준
라이브러리에 저장하고 있어요:
https://doc.rust-lang.org/stable/std/f32/consts/index.html

특정 수학 상수에 대해 자체 근사값을 사용하고 싶을 수 있지만, clippy는 그런
부정확한 수학 상수를 잠재적 오류의 원인으로 인식해요.

컴파일 출력에서 Clippy 경고의 제안을 확인하고 `std::f32::consts`의 적절한
대체 상수를 사용하세요."""

[[exercises]]
name = "clippy2"
dir = "22_clippy"
test = false
strict_clippy = true
hint = """
`Option` 값에 대한 `for` 루프는 `if-let` 문으로 더 명확하게 표현할 수 있어요.

이 연습문제를 풀기 위해 필수는 아니지만, `Option`에 대한 반복이 언제 유용한지
관심이 있다면 다음 문서 섹션을 읽어보세요:
https://doc.rust-lang.org/std/option/#iterating-over-option"""

[[exercises]]
name = "clippy3"
dir = "22_clippy"
test = false
strict_clippy = true
hint = "이번에는 힌트가 없어요!"

# TYPE CONVERSIONS

[[exercises]]
name = "conversions1"
dir = "23_conversions"
hint = """
`average` 함수의 마지막 줄에서 피연산자 중 하나를 `as` 연산자를 사용해서
기대하는 반환 타입으로 캐스팅하세요."""

[[exercises]]
name = "conversions2"
dir = "23_conversions"
hint = """
The formula for converting from Fahrenheit to Celsius is: C = (F - 32) / 1.8
This can be derived from the first formula:

             F = C * 1.8 + 32   // now subtract 32 on both sides
        F - 32 = C * 1.8        // then divide by 1.8
(F - 32) / 1.8 = C
"""

[[exercises]]
name = "conversions3"
dir = "23_conversions"
hint = """
`FromStr` 구현은 `Person` 객체가 담긴 `Ok`를 반환하거나, 문자열이 유효하지
않으면 에러가 담긴 `Err`을 반환해야 해요.

이것은 이전 `from_into` 연습문제와 거의 비슷하지만, 기본값으로 돌아가는
대신 에러를 반환해요.

또 다른 힌트: `Result`의 `map_err` 메서드를 함수나 클로저와 함께 사용해서
`parse::<u8>`의 에러를 감쌀 수 있어요.

또 다른 힌트: 해결책에서 `?` 연산자를 사용해서 에러를 전파하고 싶다면,
다음을 참고하세요:
https://doc.rust-lang.org/stable/rust-by-example/error/multiple_error_types/reenter_question_mark.html"""

[[exercises]]
name = "conversions4"
dir = "23_conversions"
hint = """
필요한 정수 변환을 수행하고 입력 범위를 확인할 수 있는 `TryFrom` 구현이
표준 라이브러리에 있을까요?

도전: `TryFrom` 구현을 여러 정수 타입에 대해 제네릭하게 만들 수 있을까요?"""

[[exercises]]
name = "conversions5"
dir = "23_conversions"
hint = """
함수에 `AsRef<str>` 또는 `AsMut<u32>`를 트레이트 바운드로 추가하세요."""
