# ERROR HANDLING

[[exercises]]
name = "errors1"
dir = "13_error_handling"
hint = """
`Ok`과 `Err`은 `Result`의 두 변형이에요. 그래서 테스트가 말하는 것은
`generate_nametag_text`가 `Option` 대신 `Result`를 반환해야 한다는 거에요.

이 변경을 하려면:
  - 함수 시그니처의 반환 타입을 `Ok(String)`과 `Err(String)` 변형을 가질 수
    있는 `Result<String, String>`으로 업데이트하세요
  - 함수 본문에서 현재 `Some(…)`을 반환하는 곳을 `Ok(…)`를 반환하도록
    변경하세요
  - 함수 본문에서 현재 `None`을 반환하는 곳을 `Err(에러 메시지)`를 반환하도록
    변경하세요"""

[[exercises]]
name = "errors2"
dir = "13_error_handling"
hint = """
이것을 처리하는 한 가지 방법은 `item_quantity.parse::<i32>()`에 대해
`Ok(something)`과 `Err(something)` 케이스를 가진 `match` 문을 사용하는 거에요.

하지만 이 패턴은 Rust에서 매우 흔해서, match 문이 하는 것과 거의 같은 일을
해주는 `?` 연산자가 있어요!

"오류 처리" 챕터의 이 섹션을 참고하세요:
https://doc.rust-lang.org/book/ch09-02-recoverable-errors-with-result.html#a-shortcut-for-propagating-errors-the--operator"""

[[exercises]]
name = "errors3"
dir = "13_error_handling"
test = false
hint = """
다른 함수가 `Result`를 반환할 수 있다면, `main`은 왜 안 될까요? `main` 함수에서
`Result<(), ErrorType>` 같은 것을 반환하는 것은 꽤 일반적인 관례에요.

유닛 타입 `()`가 있는 이유는 긍정적인 결과 측면에서 실제로 필요한 것이
없기 때문이에요."""

[[exercises]]
name = "errors4"
dir = "13_error_handling"
hint = """
`PositiveNonzeroInteger::new`는 항상 새 인스턴스를 만들고 `Ok` 결과를
반환하고 있어요. 하지만 검사를 수행하고, 검사가 실패하면 `Err`을 반환하고,
모든 것이... 괜찮다고 판단될 때만 `Ok`을 반환해야 해요 :)"""

[[exercises]]
name = "errors5"
dir = "13_error_handling"
test = false
hint = """
`main` 함수 내에서 `?` 연산자를 사용해 전파되는 두 가지 다른 `Result` 타입이
있어요. 둘 다 허용하는 `main` 함수의 반환 타입을 어떻게 선언할까요?

내부적으로 `?` 연산자는 에러 값에 `From::from`을 호출해서 박스된 트레이트
객체인 `Box<dyn Error>`로 변환해요. 이 박스된 트레이트 객체는 다형적이고,
모든 에러가 `Error` 트레이트를 구현하기 때문에, 하나의 `Box` 객체에 다양한
에러를 담을 수 있어요.

Rust 책의 이 섹션을 참고하세요:
https://doc.rust-lang.org/book/ch09-02-recoverable-errors-with-result.html#a-shortcut-for-propagating-errors-the--operator

에러 박싱에 대해 더 읽어보세요:
https://doc.rust-lang.org/stable/rust-by-example/error/multiple_error_types/boxing_errors.html

박스된 에러와 `?` 연산자 사용에 대해 더 읽어보세요:
https://doc.rust-lang.org/stable/rust-by-example/error/multiple_error_types/reenter_question_mark.html"""

[[exercises]]
name = "errors6"
dir = "13_error_handling"
hint = """
이 연습문제는 이전 연습문제에서 완성된 `PositiveNonzeroInteger` 버전을
사용해요.

`TODO`가 변경을 요청하는 줄 아래에, `Result`의 `map_err()` 메서드를 사용해서
한 타입의 에러를 다른 타입으로 변환하는 예시가 있어요. `parse()`의 `Result`에
비슷한 것을 사용해보세요. 그런 다음 `?` 연산자를 사용해서 일찍 반환할 수
있어요.

`std::result` 문서에서 `map_err()`에 대해 더 읽어보세요:
https://doc.rust-lang.org/std/result/enum.Result.html#method.map_err"""

