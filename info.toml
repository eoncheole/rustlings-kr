# PRIMITIVE TYPES

[[exercises]]
name = "primitive_types1"
dir = "04_primitive_types"
test = false
hint = """
Rust에서 불리언은 앞에 `!` 연산자를 사용해서 부정할 수 있어요.
예시: `!true == false`
이것은 불리언 변수에도 동일하게 작동해요."""

[[exercises]]
name = "primitive_types2"
dir = "04_primitive_types"
test = false
hint = "이번에는 힌트가 없어요 ;)"

[[exercises]]
name = "primitive_types3"
dir = "04_primitive_types"
test = false
hint = """
100개의 항목을 일일이 입력하지 않고도 특정 크기로 배열을 초기화하는
단축 방법이 있어요 (물론 원한다면 직접 입력해도 돼요!).

예를 들어, 이렇게 할 수 있어요:
```
let array = ["Are we there yet?"; 100];
```

보너스: `a.len() >= 100`에서 `true`를 반환할 수 있는 다른 방법에는
어떤 것들이 있을까요?"""

[[exercises]]
name = "primitive_types4"
dir = "04_primitive_types"
hint = """
Rust 책의 '소유권 이해하기 -> 슬라이스 -> 기타 슬라이스' 섹션을 참고하세요:
https://doc.rust-lang.org/book/ch04-03-slices.html
슬라이스에 넣고 싶은 배열 항목의 시작 인덱스와 끝 인덱스(+1)를 사용하세요.

두 번째 인자가 참조인데 `assert_eq!`의 첫 번째 인자에 왜 참조를 위한
앰퍼샌드(&)가 없는지 궁금하다면, nomicon의 강제 변환(coercion) 챕터를
참고하세요:
https://doc.rust-lang.org/nomicon/coercions.html"""

[[exercises]]
name = "primitive_types5"
dir = "04_primitive_types"
test = false
hint = """
Rust 책의 '데이터 타입 -> 튜플 타입' 섹션을 참고하세요:
https://doc.rust-lang.org/book/ch03-02-data-types.html#the-tuple-type
특히 구조 분해(destructuring)에 대한 부분을 보세요 (섹션의 끝에서 두 번째
예시).

`name`과 `age`를 튜플의 적절한 부분에 바인딩하는 패턴을 만들어야 해요."""

[[exercises]]
name = "primitive_types6"
dir = "04_primitive_types"
hint = """
여기서 튜플에 대해 구조 분해 `let`을 사용할 수도 있지만, 대신 인덱싱으로
접근해보세요. Rust 책의 '데이터 타입 -> 튜플 타입' 섹션의 마지막 예시에
설명되어 있어요:
https://doc.rust-lang.org/book/ch03-02-data-types.html#the-tuple-type
이제 도구 상자에 또 하나의 도구가 생겼네요!"""

# VECS

[[exercises]]
name = "vecs1"
dir = "05_vecs"
hint = """
In Rust, there are two basic ways to define a Vector.
1. One way is to use the `Vec::new()` function to create a new vector
   and fill it with the `push()` method.
2. The second way is to use the `vec![]` macro and define your elements
   inside the square brackets. This way is simpler when you exactly know
   the initial values.

Check this chapter: https://doc.rust-lang.org/book/ch08-01-vectors.html
of the Rust book to learn more."""

[[exercises]]
name = "vecs2"
dir = "05_vecs"
hint = """
벡터에 새로운 요소를 추가하려면 `.push()` 메서드를 사용하세요."""

# MOVE SEMANTICS

[[exercises]]
name = "move_semantics1"
dir = "06_move_semantics"
hint = """
벡터에 요소를 push하는 줄에서 "`vec`을 가변으로 빌릴 수 없습니다.
가변으로 선언되지 않았습니다"라는 오류가 나왔죠?

이것을 고치려면 키워드 하나를 추가해야 하는데, 벡터에 push하는 줄(오류가
발생한 줄)이 아닌 곳에 추가해야 해요.

`fill_vec()`을 호출한 후에 `vec0`에 접근해보세요. 무슨 일이 일어나는지 확인해보세요!"""

[[exercises]]
name = "move_semantics2"
dir = "06_move_semantics"
hint = """
이 연습문제를 처음 실행하면 "이동된 값의 빌림(borrow of moved value)"이라는
오류를 볼 수 있어요. Rust에서는 인자가 함수에 전달되고 명시적으로 반환되지
않으면, 원래 변수를 더 이상 사용할 수 없어요. 이것을 변수를 "이동(move)"한다고
해요. `vec0`을 `fill_vec`에 전달하면, `vec1`으로 "이동"되어서 더 이상
`vec0`에 접근할 수 없어요.

`vec0`에 있는 데이터의 별도 복사본을 만들어서 `fill_vec`에 전달할 수 있어요.
이것을 Rust에서는 클로닝(cloning)이라고 해요."""

[[exercises]]
name = "move_semantics3"
dir = "06_move_semantics"
hint = """
이전 연습문제와의 차이점은 `fn fill_vec`의 첫 번째 줄에 있던
`let mut vec = vec;`가 더 이상 없다는 거에요. 그 줄을 다시 추가하는 대신,
기존 바인딩을 불변에서 가변으로 바꾸는 한 곳에 `mut`를 추가할 수 있어요 :)"""

[[exercises]]
name = "move_semantics4"
dir = "06_move_semantics"
hint = """
각 가변 참조가 스코프에 있는 범위에 대해 신중하게 생각해보세요.
가변 참조를 가져온 직후에 `x`의 값을 업데이트하면 도움이 될까요?
Rust 책의 '참조와 빌림' 섹션에서 '가변 참조'에 대해 더 읽어보세요:
https://doc.rust-lang.org/book/ch04-02-references-and-borrowing.html#mutable-references."""

[[exercises]]
name = "move_semantics5"
dir = "06_move_semantics"
test = false
hint = """
답을 찾으려면 Rust 책의 "참조와 빌림" 섹션을 참고하세요:
https://doc.rust-lang.org/book/ch04-02-references-and-borrowing.html

첫 번째 문제는 `get_char`가 문자열의 소유권을 가져간다는 거에요. 그래서
`data`가 이동되어 `string_uppercase`에서 사용할 수 없어요. `data`가 먼저
`get_char`로 이동되므로, `string_uppercase`가 데이터를 조작할 수 없어요.

이것을 고친 후에는, `string_uppercase`의 함수 시그니처도 조정해야 해요."""

# STRUCTS

[[exercises]]
name = "structs1"
dir = "07_structs"
hint = """
Rust에는 구조체(struct) 타입이 하나 이상 있어요. 실제로 세 가지가 있고,
모든 변형은 관련 데이터를 함께 묶는 데 사용돼요.

일반 구조체(regular struct)가 있어요. 필드에 저장된 관련 데이터의 이름 있는
컬렉션이에요.

튜플 구조체(tuple struct)는 기본적으로 이름이 있는 튜플이에요.

마지막으로 유닛 구조체(unit struct)가 있어요. 필드가 없고 제네릭에 유용해요.

이 연습문제에서는 각 종류를 하나씩 완성하고 구현해야 해요.
Rust 책에서 구조체에 대해 더 읽어보세요:
https://doc.rust-lang.org/book/ch05-01-defining-structs.html"""

[[exercises]]
name = "structs2"
dir = "07_structs"
hint = """
구조체의 인스턴스를 만드는 것은 쉬워요. 필드에 값을 할당하기만 하면 돼요.

하지만 구조체를 인스턴스화할 때 사용할 수 있는 단축 방법이 있어요.
Rust 책에서 더 알아보세요:
https://doc.rust-lang.org/book/ch05-01-defining-structs.html#creating-instances-from-other-instances-with-struct-update-syntax"""

[[exercises]]
name = "structs3"
dir = "07_structs"
hint = """
